name: PMOS
options:
  bundleIdPrefix: com.assiamah
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: QGMAWHX827
    MARKETING_VERSION: 1.0.2
    CURRENT_PROJECT_VERSION: 1
targets:
  PMOS:
    type: application
    platform: iOS
    sources:
      - path: PMOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.pmos
      INFOPLIST_FILE: PMOS/Resources/Info.plist
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: 1
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SUPPORTS_XR_DESIGNED_FOR: NO
    info:
      path: PMOS/Resources/Info.plist
      properties:
        CFBundleName: PMOS
        CFBundleDisplayName: pmOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
